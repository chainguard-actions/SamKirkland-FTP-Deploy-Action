name: Test FTP Deploy - Dry Run with Custom Options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local directory with sample files
        run: |
          mkdir -p /tmp/ftp-test-opts
          echo "<html><body>Test</body></html>" > /tmp/ftp-test-opts/index.html
          echo "readme content" > /tmp/ftp-test-opts/README.md

      - name: Run FTP Deploy with custom port and protocol in dry-run mode
        id: ftp-deploy-opts
        uses: .
        with:
          server: ftp.example.com
          username: testuser
          password: testpassword
          port: "21"
          protocol: ftp
          local-dir: /tmp/ftp-test-opts/
          server-dir: /www/
          dry-run: "true"
          log-level: standard
          security: loose
          timeout: "30000"
        continue-on-error: true

      - name: Assert action ran with custom options
        run: |
          echo "outcome: ${{ steps.ftp-deploy-opts.outcome }}"
          if [ "${{ steps.ftp-deploy-opts.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with custom options (outcome=${{ steps.ftp-deploy-opts.outcome }})"

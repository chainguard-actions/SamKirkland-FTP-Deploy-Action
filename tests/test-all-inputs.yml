name: Test FTP Deploy - All Inputs Coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local directory with test file
        run: |
          mkdir -p /tmp/ftp-test-upload
          echo "test content" > /tmp/ftp-test-upload/test.txt

      - name: Run FTP Deploy with all inputs (dry-run mode)
        id: action
        continue-on-error: true
        uses: .
        with:
          server: "ftp.example.com"
          username: "testuser"
          password: "testpassword"
          port: "21"
          protocol: "ftp"
          local-dir: "/tmp/ftp-test-upload/"
          server-dir: "/public_html/"
          state-name: ".ftp-deploy-sync-state.json"
          dry-run: "true"
          dangerous-clean-slate: "false"
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
          log-level: "standard"
          security: "loose"
          timeout: "30000"

      - name: Assert action ran (dry-run may fail on connection but inputs were accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "All inputs were passed to the action successfully"
          echo "PASS: Input coverage verified"

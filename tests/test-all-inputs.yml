name: Test all inputs (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local-dir with sample file
        run: |
          mkdir -p /tmp/ftp-upload
          echo "hello" > /tmp/ftp-upload/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          server: "localhost"
          username: "testuser"
          password: "testpassword"
          port: "21"
          protocol: "ftp"
          local-dir: "/tmp/ftp-upload/"
          server-dir: "/public_html/"
          state-name: ".ftp-deploy-sync-state.json"
          dry-run: "true"
          dangerous-clean-slate: "false"
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
          log-level: "verbose"
          security: "loose"
          timeout: "30000"

      - name: Assert action ran (connection failure expected in dry-run with no server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with all inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

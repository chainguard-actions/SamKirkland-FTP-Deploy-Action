name: Test invalid protocol input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid protocol (expect failure)
        id: action
        uses: .
        with:
          server: ftp.example.com
          username: testuser
          password: testpassword
          protocol: sftp
        continue-on-error: true

      - name: Assert action failed due to invalid protocol
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid protocol, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid protocol"

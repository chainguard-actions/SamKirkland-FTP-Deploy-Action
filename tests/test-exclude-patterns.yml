name: Test FTP Deploy - Exclude Patterns
on:
  workflow_dispatch:
jobs:
  test-exclude-patterns:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pyftpdlib and start local FTP server
        run: |
          pip install pyftpdlib --quiet
          mkdir -p /tmp/ftp-root-exclude
          python3 -c "
          from pyftpdlib.handlers import FTPHandler
          from pyftpdlib.servers import FTPServer
          from pyftpdlib.authorizers import DummyAuthorizer
          import threading

          authorizer = DummyAuthorizer()
          authorizer.add_user('ftpuser', 'ftppass', '/tmp/ftp-root-exclude', perm='elradfmwMT')

          handler = FTPHandler
          handler.authorizer = authorizer
          handler.passive_ports = range(60100, 60200)

          server = FTPServer(('127.0.0.1', 2122), handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()

          import time
          time.sleep(3600)
          " &
          sleep 2
          echo "FTP server started on port 2122"

      - name: Create local files including ones to exclude
        run: |
          mkdir -p /tmp/deploy-exclude
          echo "public content" > /tmp/deploy-exclude/index.html
          echo "secret config" > /tmp/deploy-exclude/config.secret
          echo "env vars" > /tmp/deploy-exclude/.env
          echo "node modules" > /tmp/deploy-exclude/package.json

      - id: ftp-deploy
        name: Deploy files with exclusions
        uses: .
        with:
          server: "127.0.0.1"
          username: "ftpuser"
          password: "ftppass"
          port: "2122"
          protocol: "ftp"
          local-dir: "/tmp/deploy-exclude/"
          server-dir: "./"
          log-level: "verbose"
          security: "loose"
          exclude: |
            **/*.secret
            **/.env
            **/package.json

      - name: Verify excluded files were not deployed
        run: |
          echo "Checking deployed files in /tmp/ftp-root-exclude..."
          ls -la /tmp/ftp-root-exclude/ || true

          if [ ! -f "/tmp/ftp-root-exclude/index.html" ]; then
            echo "FAIL: index.html should have been deployed"
            exit 1
          fi
          echo "PASS: index.html was deployed"

          if [ -f "/tmp/ftp-root-exclude/config.secret" ]; then
            echo "FAIL: config.secret should have been excluded"
            exit 1
          fi
          echo "PASS: config.secret was excluded"

          if [ -f "/tmp/ftp-root-exclude/.env" ]; then
            echo "FAIL: .env should have been excluded"
            exit 1
          fi
          echo "PASS: .env was excluded"

          echo "PASS: All exclusion patterns worked correctly"

name: Test FTP Deploy dry-run mode
on:
  workflow_dispatch:
jobs:
  test-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local directory with test files
        run: |
          mkdir -p /tmp/ftp-test-upload
          echo "Hello World" > /tmp/ftp-test-upload/index.html
          echo "Test file" > /tmp/ftp-test-upload/test.txt

      - id: ftp-deploy
        name: Run FTP Deploy in dry-run mode
        uses: .
        continue-on-error: true
        with:
          server: "localhost"
          username: "testuser"
          password: "testpassword"
          port: "21"
          protocol: "ftp"
          local-dir: "/tmp/ftp-test-upload/"
          server-dir: "/public_html/"
          dry-run: "true"
          log-level: "verbose"

      - name: Assert action ran (dry-run with no server should fail gracefully)
        env:
          OUTCOME: ${{ steps.ftp-deploy.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          # In dry-run mode with no real FTP server, the action will attempt
          # to connect and fail. We expect either success (if dry-run skips
          # connection) or failure (if connection is attempted).
          # Either way, the action must have run (not been skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (expected run, not skip)"

name: Test FTP Deploy dry-run
on:
  workflow_dispatch:
jobs:
  test-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local directory with test files
        run: |
          mkdir -p /tmp/ftp-test-upload
          echo "Hello from FTP deploy test" > /tmp/ftp-test-upload/index.html
          echo "Test file" > /tmp/ftp-test-upload/test.txt

      - id: ftp-deploy
        name: Run FTP Deploy in dry-run mode
        uses: .
        continue-on-error: true
        with:
          server: "localhost"
          username: "testuser"
          password: "testpassword"
          port: "21"
          protocol: "ftp"
          local-dir: "/tmp/ftp-test-upload/"
          server-dir: "/public_html/"
          dry-run: "true"
          log-level: "verbose"

      - name: Assert action ran (connection failure is expected without real FTP server)
        env:
          OUTCOME: ${{ steps.ftp-deploy.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should either succeed (dry-run) or fail with a connection error
          # Both 'success' and 'failure' are valid outcomes here since no real FTP server exists
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action ran and produced an outcome: $OUTCOME"
          else
            echo "FAIL: Unexpected outcome: $OUTCOME"
            exit 1
          fi

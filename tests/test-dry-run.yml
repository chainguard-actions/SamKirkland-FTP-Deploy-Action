name: Test FTP Deploy - Dry Run
on:
  workflow_dispatch:
jobs:
  test-dry-run:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pyftpdlib and start local FTP server
        run: |
          pip install pyftpdlib --quiet
          mkdir -p /tmp/ftp-root
          python3 -c "
          from pyftpdlib.handlers import FTPHandler
          from pyftpdlib.servers import FTPServer
          from pyftpdlib.authorizers import DummyAuthorizer
          import os, threading

          authorizer = DummyAuthorizer()
          authorizer.add_user('testuser', 'testpass', '/tmp/ftp-root', perm='elradfmwMT')

          handler = FTPHandler
          handler.authorizer = authorizer
          handler.passive_ports = range(60000, 60100)

          server = FTPServer(('127.0.0.1', 2121), handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()

          import time
          time.sleep(3600)
          " &
          sleep 2
          echo "FTP server started"

      - name: Create local files to deploy
        run: |
          mkdir -p /tmp/local-deploy
          echo "Hello World" > /tmp/local-deploy/index.html
          echo "Test file" > /tmp/local-deploy/test.txt

      - id: ftp-deploy
        name: Run FTP Deploy in dry-run mode
        uses: .
        with:
          server: "127.0.0.1"
          username: "testuser"
          password: "testpass"
          port: "2121"
          protocol: "ftp"
          local-dir: "/tmp/local-deploy/"
          server-dir: "./"
          dry-run: "true"
          log-level: "verbose"

      - name: Assert dry-run completed successfully
        run: |
          echo "Dry-run step completed"
          echo "PASS: FTP deploy dry-run succeeded"

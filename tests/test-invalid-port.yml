name: Test invalid port input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy local dir to deploy from
        run: |
          mkdir -p /tmp/ftp-test-local
          echo "hello" > /tmp/ftp-test-local/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          server: "localhost"
          username: "testuser"
          password: "testpass"
          port: "21.5"
          local-dir: "/tmp/ftp-test-local/"
          dry-run: "true"

      - name: Assert action failed due to invalid port value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid port value (decimal), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid port value"

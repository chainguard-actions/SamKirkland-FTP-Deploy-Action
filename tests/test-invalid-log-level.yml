name: Test invalid log-level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a local dir with a test file
        run: |
          mkdir -p tests/upload-dir
          echo "hello" > tests/upload-dir/test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          server: "ftp.example.com"
          username: "testuser"
          password: "testpass"
          log-level: "super-verbose"
          local-dir: "tests/upload-dir/"
          dry-run: "true"

      - name: Assert action failed due to invalid log-level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid log-level, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid log-level"

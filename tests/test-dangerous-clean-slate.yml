name: Test dangerous-clean-slate input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with dangerous-clean-slate and dry-run
        id: action
        uses: .
        continue-on-error: true
        with:
          server: ftp.example.invalid
          username: testuser
          password: testpassword
          port: "21"
          protocol: ftp
          dry-run: "true"
          dangerous-clean-slate: "true"
          log-level: verbose
      - name: Assert action ran (connection failure expected with fake server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail (no real FTP server), but it must have
          # started and processed the dangerous-clean-slate input.
          # Any outcome other than 'skipped' means the input was accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs were not processed"
            exit 1
          fi
          echo "PASS: dangerous-clean-slate input was accepted and action ran"

name: Test FTP Deploy - Dangerous Clean Slate
on:
  workflow_dispatch:
jobs:
  test-dangerous-clean-slate:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pyftpdlib and start local FTP server
        run: |
          pip install pyftpdlib --quiet
          mkdir -p /tmp/ftp-root
          # Pre-populate the FTP root with a file that should be wiped
          echo "old content" > /tmp/ftp-root/old-file.txt
          python3 -c "
          from pyftpdlib.handlers import FTPHandler
          from pyftpdlib.servers import FTPServer
          from pyftpdlib.authorizers import DummyAuthorizer
          import threading

          authorizer = DummyAuthorizer()
          authorizer.add_user('testuser', 'testpass', '/tmp/ftp-root', perm='elradfmwMT')

          handler = FTPHandler
          handler.authorizer = authorizer
          handler.passive_ports = range(60000, 60100)

          server = FTPServer(('127.0.0.1', 2121), handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()

          import time
          time.sleep(3600)
          " &
          sleep 2
          echo "FTP server started on port 2121"

      - name: Create local files to deploy
        run: |
          mkdir -p /tmp/local-deploy
          echo "new content" > /tmp/local-deploy/new-file.txt

      - id: ftp-deploy
        name: Run FTP Deploy with dangerous-clean-slate
        uses: .
        with:
          server: "127.0.0.1"
          username: "testuser"
          password: "testpass"
          port: "2121"
          protocol: "ftp"
          local-dir: "/tmp/local-deploy/"
          server-dir: "./"
          dangerous-clean-slate: "true"
          log-level: "verbose"
          security: "loose"

      - name: Assert old file was removed and new file is present
        run: |
          echo "Contents of FTP root after dangerous-clean-slate deploy:"
          ls -la /tmp/ftp-root/
          if [ -f "/tmp/ftp-root/old-file.txt" ]; then
            echo "FAIL: old-file.txt should have been removed by dangerous-clean-slate"
            exit 1
          fi
          if [ ! -f "/tmp/ftp-root/new-file.txt" ]; then
            echo "FAIL: new-file.txt was not deployed"
            exit 1
          fi
          echo "PASS: dangerous-clean-slate removed old files and deployed new ones"

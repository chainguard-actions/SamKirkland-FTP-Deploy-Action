name: Test invalid dry-run boolean input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid dry-run value (non-boolean, expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          server: "ftp.example.com"
          username: "testuser"
          password: "testpassword"
          dry-run: "yes"

      - name: Assert action failed with invalid dry-run value
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with non-boolean dry-run value, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with non-boolean dry-run value"

name: Test FTP Deploy - Invalid Server Fails
on:
  workflow_dispatch:
jobs:
  test-invalid-server:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: ftp-deploy
        name: Run FTP Deploy with invalid server (expect failure)
        uses: .
        continue-on-error: true
        with:
          server: "192.0.2.1"
          username: "invalid-user"
          password: "invalid-pass"
          port: "21"
          protocol: "ftp"
          local-dir: "./"
          server-dir: "./"
          dry-run: "true"
          timeout: "5000"
          log-level: "verbose"

      - name: Assert action failed with invalid server
        env:
          OUTCOME: ${{ steps.ftp-deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid server, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when connecting to invalid server"

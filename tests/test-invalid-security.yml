name: Test invalid security input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid security value (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          server: "ftp.example.com"
          username: "testuser"
          password: "testpassword"
          security: "medium"
          dry-run: "true"

      - name: Assert action failed with invalid security value
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid security value, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid security value"

name: Test FTP Deploy - Basic Deploy
on:
  workflow_dispatch:
jobs:
  test-basic-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pyftpdlib and start local FTP server
        run: |
          pip install pyftpdlib --quiet
          mkdir -p /tmp/ftp-root
          python3 -c "
          from pyftpdlib.handlers import FTPHandler
          from pyftpdlib.servers import FTPServer
          from pyftpdlib.authorizers import DummyAuthorizer
          import threading

          authorizer = DummyAuthorizer()
          authorizer.add_user('ftpuser', 'ftppass', '/tmp/ftp-root', perm='elradfmwMT')

          handler = FTPHandler
          handler.authorizer = authorizer
          handler.passive_ports = range(60000, 60100)

          server = FTPServer(('127.0.0.1', 2121), handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()

          import time
          time.sleep(3600)
          " &
          sleep 2
          echo "FTP server started on port 2121"

      - name: Create local files to deploy
        run: |
          mkdir -p /tmp/deploy-src
          echo "<html><body>Hello FTP World</body></html>" > /tmp/deploy-src/index.html
          echo "readme content" > /tmp/deploy-src/readme.txt

      - id: ftp-deploy
        name: Deploy files via FTP
        uses: .
        with:
          server: "127.0.0.1"
          username: "ftpuser"
          password: "ftppass"
          port: "2121"
          protocol: "ftp"
          local-dir: "/tmp/deploy-src/"
          server-dir: "./"
          log-level: "verbose"
          security: "loose"

      - name: Verify files were deployed to FTP server
        run: |
          echo "Checking deployed files in /tmp/ftp-root..."
          ls -la /tmp/ftp-root/
          if [ ! -f "/tmp/ftp-root/index.html" ]; then
            echo "FAIL: index.html was not deployed to FTP server"
            exit 1
          fi
          if [ ! -f "/tmp/ftp-root/readme.txt" ]; then
            echo "FAIL: readme.txt was not deployed to FTP server"
            exit 1
          fi
          CONTENT=$(cat /tmp/ftp-root/index.html)
          echo "index.html content: $CONTENT"
          if [ "$CONTENT" != "<html><body>Hello FTP World</body></html>" ]; then
            echo "FAIL: index.html content does not match expected"
            exit 1
          fi
          echo "PASS: All files deployed successfully"
